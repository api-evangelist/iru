aid: iru
name: Iru
description: >-
  Iru (formerly Kandji) is an enterprise IT and security company that unifies
  device management, endpoint security, workforce identity, and compliance
  automation into a single AI-powered platform, trusted by 6,000+ organizations
  including Airbus, Plaid, and Vercel. Its three core products are Endpoint
  (Apple, Windows, and Android device management, threat detection and response,
  and vulnerability scanning via a single lightweight agent), Identity
  (passwordless, device-bound workforce access), and Compliance (AI-driven,
  audit-ready compliance monitoring with a public Trust Center). For developers,
  Iru exposes the Iru Endpoint Management REST API (tenant-scoped bearer tokens,
  10,000 requests/hour/tenant, US and EU regions), an official hosted MCP server
  for AI assistants, first-party Python tooling (iructl, irupkg), and a Postman
  collection.
